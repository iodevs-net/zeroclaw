# ZeroClaw Docker Compose - Personal Setup (MiniMax)
services:
  zeroclaw:
    # Usamos la variante debian para tener herramientas como git, curl y bash disponibles para el agente
    image: ghcr.io/zeroclaw-labs/zeroclaw:debian
    container_name: zeroclaw
    command: ["daemon"]
    restart: unless-stopped
    
    environment:
      # Permitimos que el gateway se enlace a la interfaz de red del contenedor
      - ZEROCLAW_ALLOW_PUBLIC_BIND=true
      - ZEROCLAW_GATEWAY_PORT=42617
      # Forzamos el uso de tu carpeta de configuración mapeada
      - ZEROCLAW_CONFIG_DIR=/home/leonardo/.zeroclaw
      
    volumes:
      # Mapeamos tu configuración personal (MiniMax, memoria, etc.) directamente al contenedor
      - /home/leonardo/.zeroclaw:/home/leonardo/.zeroclaw
      # Mapeamos el workspace para que el agente pueda trabajar en tus archivos locales
      - /home/leonardo/dev/proyectos/zeroclaw:/home/leonardo/dev/proyectos/zeroclaw
      
    ports:
      - "42617:42617"
    
    # Límites de recursos para mantener el sistema ligero
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

    healthcheck:
      test: ["CMD", "zeroclaw", "status", "--format=exit-code"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
